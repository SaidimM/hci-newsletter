name: Weekly arXiv cs.HC Digest Fetcher

on:
  schedule:
    # Runs at 08:00 UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  fetch-arxiv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Recent HCI Papers
        run: |
          python scripts/fetch_arxiv_hci.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add curated-sources/arxiv-digests/
          if git diff --staged --quiet; then
            echo "No new digest updates to commit."
          else
            git commit -m "chore(digest): auto-fetch latest arXiv cs.HC preprints [skip ci]"
            git push
          fi
